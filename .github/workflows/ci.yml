name: Reference verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify-reference:
    name: verify-reference
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify generic reference
        run: bash scripts/verify-reference.sh
  beads-linux-native-proof:
    name: beads-linux-native-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualified binary and disposable full-object/publisher proof
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$(mktemp -d)"
          trap 'rm -rf "$proof_dir"' EXIT
          curl -fsSL --retry 3 \
            'https://github.com/gastownhall/beads/releases/download/v1.2.2/beads_1.2.2_linux_amd64.tar.gz' \
            -o "$proof_dir/beads.tar.gz"
          printf '%s  %s\n' '8140098a51d3b81d5548d1c5e6db1a2d9930e5d141efe2a4bff7d079c4d321e8' "$proof_dir/beads.tar.gz" | sha256sum -c -
          tar -xzf "$proof_dir/beads.tar.gz" -C "$proof_dir" bd
          chmod +x "$proof_dir/bd"
          printf '%s  %s\n' '54fc0e0581ce4c5487a5b242f0a4f34af1ef09cf056e164a1af63a6ec7aa1e0e' "$proof_dir/bd" | sha256sum -c -
          file "$proof_dir/bd"
          BD_BIN="$proof_dir/bd" \
            BD_EXPECTED_SHA256='54fc0e0581ce4c5487a5b242f0a4f34af1ef09cf056e164a1af63a6ec7aa1e0e' \
            BD_EXPECTED_PLATFORM=linux \
            node scripts/tests/bd-linux-native-proof.test.mjs
  verify-reference-macos:
    name: verify-reference-macos
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reference prerequisites
        run: |
          command -v jq >/dev/null || brew install jq
          python --version
          node --version
          jq --version
          bash --version
      - name: Verify generic reference on macOS
        run: bash scripts/verify-reference.sh
  windows-native:
    name: windows-native
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    runs-on: windows-latest
    # Native install и wrapper достигли лимита 40 минут; сохраняем запас hosted runner.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native Git Bash and Python versions
        shell: pwsh
        run: |
          python --version
          git config --show-origin --get core.autocrlf
          git check-attr eol -- .claude/hooks/pre-bash.sh
          & 'C:/Program Files/Git/bin/bash.exe' --version
      - name: Native dispatcher and installed upgrade rollback
        shell: pwsh
        run: |
          python scripts/tests/pre-bash-dispatch.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/tests/reference-closure.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/tests/install-distribution.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Git Bash Beads wrapper (embedded/server on stub bd, project launcher)
        shell: pwsh
        run: |
          node --version
          & 'C:/Program Files/Git/bin/bash.exe' scripts/tests/bd-wt.test.sh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows-beads-activation:
    name: windows-beads-activation
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Qualified native Windows Beads 1.2.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'beads_1.2.2_windows_amd64.zip'
          $expanded = Join-Path $env:RUNNER_TEMP 'beads-1.2.2-windows'
          Invoke-WebRequest -Uri 'https://github.com/gastownhall/beads/releases/download/v1.2.2/beads_1.2.2_windows_amd64.zip' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne '1f00c29cd9599e182a4a4e829f5210daca2da14155920aee2836d8bc613b2feb') { throw 'official Windows Beads archive hash mismatch' }
          Write-Output 'Verified official Windows Beads archive SHA256=1f00c29cd9599e182a4a4e829f5210daca2da14155920aee2836d8bc613b2feb'
          Expand-Archive -Path $archive -DestinationPath $expanded
          $binaries = @(Get-ChildItem -Path $expanded -Recurse -File -Filter bd.exe)
          if ($binaries.Count -ne 1) { throw 'expected exactly one native bd.exe' }
          if ((Get-FileHash -Algorithm SHA256 $binaries[0].FullName).Hash.ToLowerInvariant() -ne 'b1f3609fea1d9f0f19b2ed49098b3628acfa6ca115aa28b01a1ee178c3a214de') { throw 'native Windows bd.exe hash mismatch' }
          Write-Output 'Verified native Windows bd.exe SHA256=b1f3609fea1d9f0f19b2ed49098b3628acfa6ca115aa28b01a1ee178c3a214de'
          Add-Content -Path $env:GITHUB_ENV -Value "OG_BD_NATIVE_BIN=$($binaries[0].FullName)" -Encoding utf8
      - name: Installed post-merge native activation and peer lifecycle
        shell: pwsh
        run: |
          python --version
          node --version
          & 'C:/Program Files/Git/bin/bash.exe' --version
          if (-not $env:OG_BD_NATIVE_BIN) { throw 'qualified native bd.exe not exported' }
          python scripts/tests/install-distribution.test.py InstallTests.test_wib_native_postmerge_activation_peer_and_lifecycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows-commit-tier:
    name: windows-commit-tier
    # Условия оператора (ADR §3.38): Git Bash, Python 3.14, ANSI code page runner без
    # PYTHONUTF8/PYTHONIOENCODING, временный каталог на D: с кириллицей, апострофом и пробелом.
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # run-python.sh берёт `py -3`; на runner есть и Python 3.15 (UTF-8 mode по умолчанию),
      # он маскировал бы зависимость от ANSI code page. Версия проверяется шагом ниже.
      PY_PYTHON: '3.14'
      PY_PYTHON3: '3.14'
      PYTHON_MANAGER_DEFAULT: '3.14'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Temporary directories on D with Cyrillic and space
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Нет D: — FAIL, а не тихий переход на C:.
          if (-not (Test-Path -LiteralPath 'D:\')) { throw 'D: drive is required for windows-commit-tier' }
          $cyrillic = [string][char]0x0442 + [char]0x0435 + [char]0x0441 + [char]0x0442
          # Апостроф в корне TMPDIR не ставится: MSYS не преобразует argv-путь с апострофом
          # для нативных программ (проба ниже), это свойство MSYS, а не продукта. Пути с
          # апострофом проверяют фикстуры (bd-node-path, python-launcher, pre-bash-dispatch).
          # TEMP — отдельный каталог: /tmp Git Bash монтируется на TEMP, и TMPDIR под ним
          # дал бы два написания одного каталога.
          $tmpdir = 'og-' + $cyrillic + ' tmp'
          $temp = 'og-' + $cyrillic + ' temp'
          foreach ($name in @($tmpdir, $temp)) { New-Item -ItemType Directory -Force -Path (Join-Path 'D:\' $name) | Out-Null }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value ('TMPDIR=/d/' + $tmpdir)
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value ('TEMP=D:\' + $temp)
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value ('TMP=D:\' + $temp)
          Write-Output "TMPDIR=/d/$tmpdir TEMP=D:\$temp"
      - name: Environment, encoding and symlink privilege
        shell: bash
        run: |
          set -u
          printf 'PYTHONUTF8=[%s] PYTHONIOENCODING=[%s] TMPDIR=[%s] TEMP=[%s]\n' "${PYTHONUTF8-}" "${PYTHONIOENCODING-}" "$TMPDIR" "$TEMP"
          if [ -n "${PYTHONUTF8-}" ] || [ -n "${PYTHONIOENCODING-}" ]; then echo 'UTF-8 override must be absent' >&2; exit 1; fi
          case "$TMPDIR" in /d/*) ;; *) echo 'TMPDIR must be on D:' >&2; exit 1 ;; esac
          bash --version | head -1
          git --version
          node --version
          jq --version
          py --list || true
          py -3 --version
          case "$(py -3 --version 2>&1)" in 'Python 3.14.'*) ;; *) echo 'py -3 must resolve to Python 3.14' >&2; exit 1 ;; esac
          py -3 -c "import locale, os, sys, tempfile; print('preferred', locale.getpreferredencoding(), 'stdout', sys.stdout.encoding, 'utf8_mode', sys.flags.utf8_mode, 'tmp', tempfile.gettempdir())"
          cmd //c where bash
          cmd //c where git
          # Привилегия создания symlink печатается явно: от неё зависят SKIP-кейсы D-2.
          /c/Windows/System32/whoami.exe //priv | grep -i SeCreateSymbolicLinkPrivilege || echo 'SeCreateSymbolicLinkPrivilege: absent'
          probe="$(mktemp -d)"
          py -3 -c "import os, sys; os.symlink(os.path.join(sys.argv[1], 'missing'), os.path.join(sys.argv[1], 'link')); print('python os.symlink: available')" "$(cygpath -w "$probe")" || echo 'python os.symlink: unavailable'
          # Диагностика MSYS-преобразования argv нативному git.exe по форме пути.
          for name in plain "space dir" "кириллица" "apos's" "Проект's (QA) space"; do
            mkdir -p "$probe/$name"
            if git -C "$probe/$name" init -q >/dev/null 2>&1; then echo "msys argv ok: $name"; else echo "msys argv FAIL: $name"; fi
          done
          rm -rf "$probe"
      - name: Commit tier (verify.sh)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          start=$SECONDS
          rc=0
          bash .agents/project/verify.sh || rc=$?
          echo "verify.sh wall time: $((SECONDS-start)) s"
          exit $rc
      - name: Steps outside commit tier (former commit tier)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          PY=.claude/tools/run-python.sh
          LOG="$(mktemp -d)"
          failed=''
          step() {
            local label="$1" start=$SECONDS rc=0
            shift
            "$@" >"$LOG/$label.log" 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf 'PASS %s (%s s)\n' "$label" "$((SECONDS-start))"
            else
              printf 'FAIL %s (exit %s, %s s)\n' "$label" "$rc" "$((SECONDS-start))"
              tail -n 80 "$LOG/$label.log"
              failed="$failed $label"
            fi
          }
          step structure "$PY" scripts/check-reference.py
          step structural-mutations "$PY" scripts/tests/check-reference.test.py
          step closure-mutations "$PY" scripts/tests/reference-closure.test.py
          step pre-bash-dispatch "$PY" scripts/tests/pre-bash-dispatch.test.py
          step portability-names "$PY" scripts/tests/portability-names.test.py
          step activation bash scripts/tests/activation-routing.test.sh
          step mutation-guard bash scripts/tests/repository-mutation-guard.test.sh
          step classifier bash scripts/tests/commit-command-classifier.test.sh
          step commit-gate "$PY" scripts/tests/commit-gate.test.py
          step readiness "$PY" .claude/hooks/test_check_merge_ready.py
          step python-launcher bash scripts/tests/python-launcher.test.sh
          step verify-tiers "$PY" scripts/tests/verify-tiers.test.py
          step publisher "$PY" scripts/tests/publish-pr-comment.test.py
          step with-timeout bash scripts/tests/with-timeout.test.sh
          step with-timeout-transparency bash scripts/tests/with-timeout-transparency.test.sh
          step merge-gate-script-run-parity bash scripts/tests/merge-gate-script-run-parity.test.sh
          step merge-gate-parse-completeness bash scripts/tests/merge-gate-parse-completeness.test.sh
          step merge-gate-parse-budget bash scripts/tests/merge-gate-parse-budget.test.sh
          step gate-arithmetic-expansion bash scripts/tests/gate-arithmetic-expansion.test.sh
          step gate-heredoc-delimiter bash scripts/tests/gate-heredoc-delimiter.test.sh
          step gate-line-continuation-parity bash scripts/tests/gate-line-continuation-parity.test.sh
          step shell-grammar-single-source bash scripts/tests/shell-grammar-single-source.test.sh
          step module-resolution-closure bash scripts/tests/module-resolution-closure.test.sh
          step finalize-triage-parse bash scripts/tests/finalize-triage-parse.test.sh
          step finalize-gate-script bash scripts/tests/finalize-gate-script.test.sh
          step bd-node-path bash scripts/tests/bd-node-path.test.sh
          step bd-read bash scripts/tests/bd-read.test.sh
          step bd-wt bash scripts/tests/bd-wt.test.sh
          step merge-gate-parse-complexity "$PY" scripts/tests/merge-gate-parse-complexity.test.py
          step readiness-declaration-corpus "$PY" scripts/tests/readiness-declaration-corpus.test.py
          step readiness-policy-complexity "$PY" scripts/tests/readiness-policy-complexity.test.py
          step shell-nonascii-expansion "$PY" scripts/tests/shell-nonascii-expansion.test.py
          step finalizer-validator bash .claude/skills/finalize-pr/validators/test_validate_review_pass.sh
          step finalize-no-beads "$PY" scripts/tests/finalize-no-beads.test.py
          if [ -n "$failed" ]; then echo "FAILED:$failed" >&2; exit 1; fi
